name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    paths:
      - 'Program.cs'
      - 'CodexLimitBar.csproj'
      - 'CodexLimitBar.ico'
      - '.github/workflows/build-exe.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Publish single-file EXE
        run: dotnet publish CodexLimitBar.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true

      - name: Show output
        shell: pwsh
        run: Get-ChildItem -Recurse bin/Release/net8.0-windows/win-x64/publish

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v7
        with:
          name: CodexLimitBar-Windows-x64-v1.3.0
          path: bin/Release/net8.0-windows/win-x64/publish/CodexLimitBar.exe
          if-no-files-found: error
